---
- name: "[21] Join worker nodes to Kubernetes cluster"
  hosts: workers
  become: true
  gather_facts: true

  vars:
    cri_socket: "unix:///var/run/containerd/containerd.sock"

  pre_tasks:
    # Проверяем локально: kubelet.conf появляется только после успешного join,
    # поэтому обращаться к API-серверу здесь не нужно
    - name: 21-1 Check if node already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    # Именно end_host, а не end_play: end_play оборвал бы play
    # для всех workers, и новая нода никогда бы не присоединилась,
    # если хоть одна нода в группе уже в кластере
    - name: 21-2 Exit if this node is already joined
      meta: end_host
      when: kubelet_conf.stat.exists

  tasks:
    # Токен создаётся заново перед каждым запуском: он живёт 24 часа,
    # а хранить его в файле на мастере ненадёжно
    - name: 21-3 Create fresh join command on master
      command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false
      delegate_to: "{{ master_name }}"
      run_once: true

    - name: 21-4 Parse join parameters
      set_fact:
        kubeadm_join_api_server: "{{ join_command_raw.stdout | regex_search('kubeadm join (\\S+):6443', '\\1') | first }}"
        kubeadm_join_token: "{{ join_command_raw.stdout | regex_search('--token (\\S+)', '\\1') | first }}"
        kubeadm_join_ca_hash: "{{ join_command_raw.stdout | regex_search('--discovery-token-ca-cert-hash sha256:(\\S+)', '\\1') | first }}"

    - name: 21-5 Verify join parameters
      assert:
        that:
          - kubeadm_join_token is defined and kubeadm_join_token != ''
          - kubeadm_join_ca_hash is defined and kubeadm_join_ca_hash != ''
          - kubeadm_join_api_server is defined and kubeadm_join_api_server != ''

    - name: 21-6 Join worker to cluster
      command: >
        kubeadm join {{ kubeadm_join_api_server }}:6443
        --token {{ kubeadm_join_token }}
        --discovery-token-ca-cert-hash sha256:{{ kubeadm_join_ca_hash }}
        --cri-socket {{ cri_socket }}
        --ignore-preflight-errors=All

    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted

  post_tasks:
    - name: Show join status
      debug:
        msg: "✅ Worker node {{ inventory_hostname }} joined the cluster!"
