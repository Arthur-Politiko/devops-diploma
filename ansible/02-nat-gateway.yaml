---
# Плейбук настройки NAT на NAT-ноде
# Обеспечивает доступ private-нод в интернет через NAT (masquerade)
- name: "[02] Configure NAT gateway"
  hosts: nat_gateway
  become: true
  gather_facts: false

  tasks:
    - name: Install NAT packages without remote Python
      ansible.builtin.raw: >-
        export DEBIAN_FRONTEND=noninteractive;
        apt-get update &&
        apt-get install -y iptables iptables-persistent

    - name: Enable IP forwarding and configure masquerading
      ansible.builtin.raw: >-
        sysctl -w net.ipv4.ip_forward=1 &&
        printf 'net.ipv4.ip_forward = 1\n' > /etc/sysctl.d/99-kubernetes-nat.conf &&
        sysctl --system >/dev/null &&
        IFACE=$(ip route show default | awk 'NR==1 {print $5}') &&
        (iptables -t nat -C POSTROUTING -o "$IFACE" -j MASQUERADE 2>/dev/null ||
        iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE) &&
        netfilter-persistent save