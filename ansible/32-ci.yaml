---
# TeamCity на admin-ноде: сервер, агент сборки и публикация веб-интерфейса.
# Блок 3x: дополнения в уже собранном кластере.
#
# Почему CI вынесен из кластера: сборка идёт хостовым Docker (никакого dind
# и privileged-подов), данные TeamCity лежат на диске ноды, kubectl уже под рукой.
#
# Требования:
#   - файл vault/ci-registry-key.json — ключ сервисного аккаунта Yandex Cloud
#     с ролями container-registry.images.pusher и images.puller на реестр
#   - на admin уже развёрнут kubeconfig (плейбук 23-admin-kube-config.yaml)
#
# Первичная настройка TeamCity (лицензия, администратор) делается один раз
# через веб-интерфейс: Professional бесплатен, ключ не требуется.

- name: "[32] Deploy TeamCity on admin node"
  hosts: admin
  become: false
  gather_facts: true

  vars:
    ci_domain: "debugmonkey.ru"
    ci_namespace: "ci"
    app_namespace: "web-app"
    deploy_sa: "ci-deployer"
    teamcity_tag: "2026.2"
    kubeconfig_path: "/home/ubuntu/.kube/config"
    ci_kubeconfig: "/home/ubuntu/ci-kubeconfig"
    registry_key_file: "{{ playbook_dir }}/../vault/ci-registry-key.json"
    registry_key_remote: "/home/ubuntu/ci-registry-key.json"
    ci_data_dir: "/home/ubuntu/teamcity"
    rendered_dir: "/home/ubuntu/rendered"
    # Адрес API-сервера берём по IP: имя k8s-master-01 резолвится только
    # на admin через /etc/hosts, а kubeconfig читается ещё и из контейнера агента.
    api_server: "https://{{ master_ip }}:6443"
    # Адрес самой admin-ноды — его получают Endpoints, через которые ingress
    # проксирует трафик на TeamCity, живущий вне кластера.
    admin_internal_ip: "{{ ansible_host }}"

  tasks:
    # ------------------------- Docker -------------------------
    - name: "32-1 Install Docker apt prerequisites"
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
      become: true

    - name: "32-2 Add Docker GPG key"
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc
      become: true

    - name: "32-3 Add Docker repository"
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present
        update_cache: true
      become: true

    - name: "32-4 Install Docker Engine"
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
        state: present
      become: true

    # ------------------------- Данные и ключ реестра -------------------------
    - name: "32-5 Require registry key file"
      ansible.builtin.assert:
        that: lookup('file', registry_key_file, errors='ignore') | length > 0
        quiet: true
        fail_msg: >-
          Не найден ключ реестра {{ registry_key_file }}. Создай его:
          yc iam key create --service-account-id <sa-id> --output vault/ci-registry-key.json

    - name: "32-6 Copy registry key to admin node"
      ansible.builtin.copy:
        content: "{{ lookup('file', registry_key_file) }}"
        dest: "{{ registry_key_remote }}"
        mode: "0600"
      no_log: true

    - name: "32-7 Create TeamCity data directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - "{{ ci_data_dir }}/server"
        - "{{ ci_data_dir }}/agent/conf"
        - "{{ ci_data_dir }}/agent/work"
      become: true

    # ------------------------- Kubeconfig для деплоя -------------------------
    - name: "32-8 Create deploy ServiceAccount"
      ansible.builtin.command: kubectl -n {{ app_namespace }} create serviceaccount {{ deploy_sa }}
      register: sa_create
      changed_when: "'created' in sa_create.stdout"
      failed_when: sa_create.rc != 0 and 'already exists' not in (sa_create.stderr | lower)
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # Долгоживущий токен: снаружи кластера иначе не аутентифицироваться.
    - name: "32-9 Create long-lived token for the deploy account"
      ansible.builtin.shell: |
        kubectl -n {{ app_namespace }} apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: {{ deploy_sa }}-token
          annotations:
            kubernetes.io/service-account.name: {{ deploy_sa }}
        type: kubernetes.io/service-account-token
        EOF
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: "32-10 Wait for the token to be issued"
      ansible.builtin.shell: >-
        kubectl -n {{ app_namespace }} get secret {{ deploy_sa }}-token
        -o jsonpath='{.data.token}' | base64 -d
      register: sa_token
      until: sa_token.stdout | length > 20
      retries: 12
      delay: 5
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      no_log: true

    - name: "32-11 Read cluster CA"
      ansible.builtin.command: >-
        kubectl config view --raw --minify
        -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
      register: cluster_ca
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      no_log: true

    # У set-cluster нет флага --certificate-authority-data: CA передаётся файлом
    # с --embed-certs, иначе сертификат в kubeconfig не попадёт и kubectl уйдёт
    # на localhost:8080. Значение CA достаём из kubeconfig admin-ноды.
    - name: "32-12 Build kubeconfig for the pipeline"
      ansible.builtin.shell: |
        set -e
        K={{ ci_kubeconfig }}
        CA=/tmp/ci-ca.crt
        kubectl config view --raw --minify \
          -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
          --kubeconfig={{ kubeconfig_path }} | base64 -d > "$CA"
        rm -f "$K"
        kubectl config set-cluster k8s --server={{ api_server }} \
          --certificate-authority="$CA" --embed-certs=true --kubeconfig="$K"
        kubectl config set-credentials {{ deploy_sa }} --token='{{ sa_token.stdout }}' --kubeconfig="$K"
        kubectl config set-context ci --cluster=k8s --user={{ deploy_sa }} --kubeconfig="$K"
        kubectl config use-context ci --kubeconfig="$K"
        chmod 0600 "$K"
        rm -f "$CA"
      args:
        creates: "{{ ci_kubeconfig }}"
      no_log: true

    # ------------------------- Контейнеры TeamCity -------------------------
    - name: "32-13 Run TeamCity server"
      ansible.builtin.shell: |
        if docker ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx teamcity-server; then
          echo "exists"
        else
          docker run -d --name teamcity-server --restart always \
            -p 8111:8111 \
            -e TEAMCITY_SERVER_MEM_OPTS="-Xmx2048m" \
            -v {{ ci_data_dir }}/server:/data/teamcity_server/datadir \
            jetbrains/teamcity-server:{{ teamcity_tag }} >/dev/null && echo "created"
        fi
      register: tc_server
      changed_when: "'created' in tc_server.stdout"
      become: true

    # Агент собирает образы хостовым Docker: пробрасываем сокет и добавляем
    # группу сокета, чтобы пользователь агента имел к нему доступ.
    # kubectl монтируем с хоста — скачивать его в шаге сборки не нужно.
    # Путь к kubectl узнаём на месте: он ставится пакетом и лежит в /usr/bin,
    # а не в /usr/local/bin. Если смонтировать несуществующий путь, Docker создаст
    # на его месте каталог, и внутри контейнера kubectl окажется директорией.
    - name: "32-13a Find kubectl path"
      ansible.builtin.shell: command -v kubectl
      register: kubectl_bin
      changed_when: false
      failed_when: kubectl_bin.rc != 0

    - name: "32-14 Run TeamCity agent"
      ansible.builtin.shell: |
        if docker ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx teamcity-agent; then
          echo "exists"
        else
          docker run -d --name teamcity-agent --restart always \
            --add-host host.docker.internal:host-gateway \
            -e SERVER_URL=http://host.docker.internal:8111 \
            -e AGENT_NAME=k8s-agent-01 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add $(stat -c '%g' /var/run/docker.sock) \
            -v {{ registry_key_remote }}:/keys/key.json:ro \
            -v {{ ci_kubeconfig }}:/keys/kubeconfig:ro \
            -v {{ kubectl_bin.stdout }}:/usr/local/bin/kubectl:ro \
            -v {{ ci_data_dir }}/agent/conf:/data/teamcity_agent/conf \
            -v {{ ci_data_dir }}/agent/work:/opt/buildagent/work \
            jetbrains/teamcity-agent:{{ teamcity_tag }} >/dev/null && echo "created"
        fi
      register: tc_agent
      changed_when: "'created' in tc_agent.stdout"
      become: true

    # ------------------------- Публикация UI в кластере -------------------------
    - name: "32-15 Create namespace for CI objects"
      ansible.builtin.command: kubectl create namespace {{ ci_namespace }}
      register: ns_create
      changed_when: "'created' in ns_create.stdout"
      failed_when: ns_create.rc != 0 and 'AlreadyExists' not in ns_create.stderr
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # Старые объекты CI из кластера больше не нужны: сервер и агент теперь на VM.
    - name: "32-16 Remove in-cluster TeamCity workloads"
      ansible.builtin.command: >-
        kubectl -n {{ ci_namespace }} delete deployment teamcity-server teamcity-agent
        serviceaccount teamcity-agent --ignore-not-found=true
      register: ci_cleanup
      changed_when: "'deleted' in ci_cleanup.stdout"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: "32-17 Create directory for rendered manifests"
      ansible.builtin.file:
        path: "{{ rendered_dir }}"
        state: directory
        mode: "0755"

    - name: "32-18 Render external service manifests"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/ci/ci-external.yaml.j2"
        dest: "{{ rendered_dir }}/ci-external.yaml"
        mode: "0644"

    - name: "32-19 Apply external service manifests"
      ansible.builtin.command: kubectl apply -f {{ rendered_dir }}/ci-external.yaml
      register: ci_external
      changed_when: "'created' in ci_external.stdout or 'configured' in ci_external.stdout"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: "32-20 Wait for TeamCity server to answer"
      ansible.builtin.uri:
        url: "http://localhost:8111/healthCheck/healthy"
        status_code: 200
      register: tc_health
      until: tc_health.status == 200
      retries: 30
      delay: 10
      changed_when: false

  post_tasks:
    - name: Display URL and next steps
      ansible.builtin.debug:
        msg:
          - "TeamCity: http://ci.{{ ci_domain }}/"
          - "Контейнеры: teamcity-server и teamcity-agent на admin-ноде"
          - "Если это первый запуск — пройди настройку в браузере (лицензия, администратор),"
          - "затем создай проект web-app и две сборки через API или в интерфейсе."
