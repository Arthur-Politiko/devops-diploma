---
# Подготовка admin-ноды для CI/CD: Docker, ключи и права пайплайна.
# Блок 3x: дополнения в уже собранном кластере.
#
# Сам CI ставится отдельно — плейбуком 34-jenkins.yaml. Здесь остаётся то, что
# нужно ему на ноде:
#   Docker              — сборка образов хостовым демоном (никакого dind)
#   ключ реестра        — push/pull образов приложения
#   terraform и ключи   — инфраструктурный пайплайн (раздел 6 roadmap)
#   SA, токен, kubeconfig ci-deployer — права пайплайна на деплой
#
# Почему CI вынесен из кластера: сборка идёт хостовым Docker (никакого dind
# и privileged-подов), данные лежат на диске ноды, kubectl уже под рукой.
#
# Требования:
#   - файл vault/ci-registry-key.json — ключ сервисного аккаунта Yandex Cloud
#     с ролями container-registry.images.pusher и images.puller на реестр
#   - файлы vault/diploma-sa-key.json и vault/s3_key — для инфраструктурного
#     пайплайна terraform (раздел 6 roadmap)
#   - на admin уже развёрнут kubeconfig (плейбук 23-admin-kube-config.yaml)
#
# Что получает CI в контейнере (монтирует 34-jenkins.yaml):
#   /keys/key.json       — ключ реестра (push/pull образов приложения)
#   /keys/kubeconfig     — kubeconfig сервисного аккаунта ci-deployer
#   /keys/tf-sa-key.json — ключ сервисного аккаунта для terraform
#   /keys/s3_key         — статический ключ доступа к Object Storage (backend)
#   /keys/ci.tfvars      — переменные terraform для CI (terraform.tfvars в git не хранится)
#   /keys/terraformrc    — зеркало провайдеров Yandex Cloud (HashiCorp блокирует регион)
#   /usr/local/bin/terraform — бинарь terraform с хоста

- name: "[32] Prepare admin node for CI"
  hosts: admin
  become: false
  gather_facts: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    deploy_sa: "ci-deployer"
    ci_kubeconfig: "/home/ubuntu/ci-kubeconfig"
    registry_key_file: "{{ playbook_dir }}/../vault/ci-registry-key.json"
    registry_key_remote: "/home/ubuntu/ci-registry-key.json"

    # --- Terraform для инфраструктурного пайплайна (раздел 6 roadmap) ---
    # Бинарь ставится на ноду и монтируется в контейнер CI: запускать terraform
    # через docker run нельзя — контейнер видит рабочую директорию не так, как
    # демон хоста, и путь из контейнера в -v не разрешится.
    terraform_version: "1.14.8"
    tf_sa_key_file: "{{ playbook_dir }}/../vault/diploma-sa-key.json"
    tf_sa_key_remote: "/home/ubuntu/tf-sa-key.json"
    s3_key_file: "{{ playbook_dir }}/../vault/s3_key"
    s3_key_remote: "/home/ubuntu/s3_key"
    # Публичный SSH-ключ нужен terraform в пайплайне: он подставляет его в
    # metadata машин (var.ssh_key). Секретом не является.
    ssh_pub_key_file: "{{ playbook_dir }}/../vault/id_ed25519.pub"
    ssh_pub_key_remote: "/home/ubuntu/id_ed25519.pub"
    tf_tfvars_remote: "/home/ubuntu/ci.tfvars"
    terraformrc_remote: "/home/ubuntu/terraformrc"
    # Идентификаторы каталога — не секреты; те же значения лежат в bootstrap/00-bootstrap.sh
    tf_org_id: "bpfuhii9ok1q5hhitspn"
    tf_cloud_id: "b1gguv60gg3mvfac0ql6"
    tf_folder_id: "b1g3ccq6pd5djimr73u2"
    tf_sa_id: "ajeci4s6cdan53143ob7"
    # Адрес API-сервера берём по IP: имя k8s-master-01 резолвится только
    # на admin через /etc/hosts, а kubeconfig читается ещё и из контейнера CI.
    api_server: "https://{{ master_ip }}:6443"

  tasks:
    - name: Wait for apt to be free
      ansible.builtin.include_tasks: tasks/wait-for-apt.yml

    # ------------------------- Docker -------------------------
    - name: "32-1 Install Docker apt prerequisites"
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
      become: true

    - name: "32-2 Add Docker GPG key"
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc
      become: true

    - name: "32-3 Add Docker repository"
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present
        update_cache: true
      become: true

    - name: "32-4 Install Docker Engine"
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
        state: present
      become: true

    # ------------------------- Данные и ключ реестра -------------------------
    - name: "32-5 Require registry key file"
      ansible.builtin.assert:
        that: lookup('file', registry_key_file, errors='ignore') | length > 0
        quiet: true
        fail_msg: >-
          Не найден ключ реестра {{ registry_key_file }}. Создай его:
          yc iam key create --service-account-id <sa-id> --output vault/ci-registry-key.json

    - name: "32-6 Copy registry key to admin node"
      ansible.builtin.copy:
        content: "{{ lookup('file', registry_key_file) }}"
        dest: "{{ registry_key_remote }}"
        mode: "0600"
      no_log: true

    # ------------------------- Terraform для инфра-пайплайна -------------------------
    - name: "32-7a Check installed terraform"
      ansible.builtin.command: terraform version
      register: tf_check
      changed_when: false
      failed_when: false

    - name: "32-7b Install terraform {{ terraform_version }}"
      when: tf_check.rc != 0 or terraform_version not in tf_check.stdout
      block:
        - name: "32-7b-1 Install unzip"
          ansible.builtin.apt:
            name: unzip
            state: present
            update_cache: true
          become: true

        # releases.hashicorp.com отдаёт 404 для российских адресов («Content not
        # available in your region»), поэтому качаем с зеркала Yandex Cloud.
        - name: "32-7b-2 Download terraform archive"
          ansible.builtin.get_url:
            url: >-
              https://hashicorp-releases.yandexcloud.net/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip
            dest: "/tmp/terraform-{{ terraform_version }}.zip"
            mode: "0644"

        - name: "32-7b-3 Unpack terraform"
          ansible.builtin.unarchive:
            src: "/tmp/terraform-{{ terraform_version }}.zip"
            dest: /usr/local/bin
            remote_src: true
            mode: "0755"
          become: true

        - name: "32-7b-4 Verify terraform"
          ansible.builtin.command: terraform version
          changed_when: false

    - name: "32-7c Require terraform service account key"
      ansible.builtin.assert:
        that: lookup('file', tf_sa_key_file, errors='ignore') | length > 0
        quiet: true
        fail_msg: >-
          Не найден ключ {{ tf_sa_key_file }}. Он создаётся bootstrap/00-bootstrap.sh.

    - name: "32-7d Require S3 static key"
      ansible.builtin.assert:
        that: lookup('file', s3_key_file, errors='ignore') | length > 0
        quiet: true
        fail_msg: "Не найден файл {{ s3_key_file }} со статическим ключом доступа к Object Storage."

    - name: "32-7e Copy terraform SA key to admin node"
      ansible.builtin.copy:
        content: "{{ lookup('file', tf_sa_key_file) }}"
        dest: "{{ tf_sa_key_remote }}"
        mode: "0600"
      no_log: true

    - name: "32-7f Copy S3 static key to admin node"
      ansible.builtin.copy:
        content: "{{ lookup('file', s3_key_file) }}"
        dest: "{{ s3_key_remote }}"
        mode: "0600"
      no_log: true

    # terraform читает этот файл при планировании (var.ssh_key), а в чекауте
    # сборки каталога vault/ нет.
    - name: "32-7f2 Copy SSH public key to admin node"
      ansible.builtin.copy:
        src: "{{ ssh_pub_key_file }}"
        dest: "{{ ssh_pub_key_remote }}"
        mode: "0644"

    # terraform.tfvars в git не попадает (см. .gitignore), поэтому для пайплайна
    # рендерится отдельный файл переменных. Путь к ключу — контейнерный.
    - name: "32-7g Render ci.tfvars for the terraform pipeline"
      ansible.builtin.copy:
        content: |
          organization_id = "{{ tf_org_id }}"
          cloud_id        = "{{ tf_cloud_id }}"
          folder_id       = "{{ tf_folder_id }}"
          sa_id           = "{{ tf_sa_id }}"
          sa_key_file     = "/keys/tf-sa-key.json"
          ssh_key         = "/keys/id_ed25519.pub"
        dest: "{{ tf_tfvars_remote }}"
        mode: "0644"

    # registry.terraform.io тоже отдаёт 404 для российских адресов, поэтому
    # terraform init ходит за провайдерами через зеркало Yandex Cloud.
    - name: "32-7h Render terraformrc with provider mirror"
      ansible.builtin.copy:
        content: |
          provider_installation {
            network_mirror {
              url     = "https://terraform-mirror.yandexcloud.net/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
        dest: "{{ terraformrc_remote }}"
        mode: "0644"

    # ------------------ Namespace приложения до ServiceAccount ------------------
    # SA создаётся внутри namespace, а полный манифест (Namespace, Role,
    # RoleBinding) применяет 33-app-prepare.yaml — в цепочке 90-install-k8s.yaml
    # он идёт позже. Поэтому namespace заводим здесь; повторный apply в 33
    # идемпотентен, а RoleBinding ссылается на SA, созданный ниже.
    - name: "32-7i Ensure app namespace exists"
      ansible.builtin.command: kubectl create namespace {{ app_namespace }}
      register: app_ns_create
      changed_when: "'created' in app_ns_create.stdout"
      failed_when: app_ns_create.rc != 0 and 'AlreadyExists' not in app_ns_create.stderr

    # ------------------------- Kubeconfig для деплоя -------------------------
    - name: "32-8 Create deploy ServiceAccount"
      ansible.builtin.command: kubectl -n {{ app_namespace }} create serviceaccount {{ deploy_sa }}
      register: sa_create
      changed_when: "'created' in sa_create.stdout"
      failed_when: sa_create.rc != 0 and 'already exists' not in (sa_create.stderr | lower)

    # Долгоживущий токен: снаружи кластера иначе не аутентифицироваться.
    - name: "32-9 Create long-lived token for the deploy account"
      ansible.builtin.shell: |
        kubectl -n {{ app_namespace }} apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: {{ deploy_sa }}-token
          annotations:
            kubernetes.io/service-account.name: {{ deploy_sa }}
        type: kubernetes.io/service-account-token
        EOF
      changed_when: false

    - name: "32-10 Wait for the token to be issued"
      ansible.builtin.shell: >-
        kubectl -n {{ app_namespace }} get secret {{ deploy_sa }}-token
        -o jsonpath='{.data.token}' | base64 -d
      register: sa_token
      until: sa_token.stdout | length > 20
      retries: 12
      delay: 5
      changed_when: false
      no_log: true

    # CA берём готовым base64 — в kubeconfig он нужен в том же виде.
    - name: "32-11 Read cluster CA"
      ansible.builtin.command: >-
        kubectl config view --raw --minify
        -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
      register: cluster_ca
      changed_when: false
      no_log: true

    # Kubeconfig — обычный YAML, поэтому рендерим его шаблоном, а не пятью
    # командами `kubectl config set-*`. Заодно уходит возня с --embed-certs.
    # В отличие от creates:, содержимое сравнивается: если кластер пересобрали
    # и CA или токен сменились, файл обновится, а не останется мёртвым.
    - name: "32-12 Render kubeconfig for the pipeline"
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: k8s
              cluster:
                server: "{{ api_server }}"
                certificate-authority-data: "{{ cluster_ca.stdout }}"
          users:
            - name: "{{ deploy_sa }}"
              user:
                token: "{{ sa_token.stdout }}"
          contexts:
            - name: ci
              context:
                cluster: k8s
                user: "{{ deploy_sa }}"
          current-context: ci
        dest: "{{ ci_kubeconfig }}"
        mode: "0600"
      no_log: true

    - name: Display what was prepared
      ansible.builtin.debug:
        msg:
          - "Docker, ключ реестра и ключи terraform разложены на admin-ноде"
          - "Права пайплайна на деплой: ServiceAccount {{ deploy_sa }} в namespace {{ app_namespace }}"
          - "Terraform для инфра-пайплайна: {{ terraform_version }}"
          - "Сам CI ставится следующим шагом — плейбуком 34-jenkins.yaml"
