---
# TeamCity на admin-ноде: сервер, агент сборки и публикация веб-интерфейса.
# Блок 3x: дополнения в уже собранном кластере.
#
# Почему CI вынесен из кластера: сборка идёт хостовым Docker (никакого dind
# и privileged-подов), данные TeamCity лежат на диске ноды, kubectl уже под рукой.
#
# Требования:
#   - файл vault/ci-registry-key.json — ключ сервисного аккаунта Yandex Cloud
#     с ролями container-registry.images.pusher и images.puller на реестр
#   - файлы vault/diploma-sa-key.json и vault/s3_key — для инфраструктурного
#     пайплайна terraform (раздел 6 roadmap)
#   - на admin уже развёрнут kubeconfig (плейбук 23-admin-kube-config.yaml)
#
# Что получает агент сборки в контейнере:
#   /keys/key.json       — ключ реестра (push/pull образов приложения)
#   /keys/kubeconfig     — kubeconfig сервисного аккаунта ci-deployer
#   /keys/tf-sa-key.json — ключ сервисного аккаунта для terraform
#   /keys/s3_key         — статический ключ доступа к Object Storage (backend)
#   /keys/ci.tfvars      — переменные terraform для CI (terraform.tfvars в git не хранится)
#   /keys/terraformrc    — зеркало провайдеров Yandex Cloud (HashiCorp блокирует регион)
#   /usr/local/bin/terraform — бинарь terraform с хоста
#
# Первичная настройка TeamCity (лицензия, администратор) делается один раз
# через веб-интерфейс: Professional бесплатен, ключ не требуется.

- name: "[32] Deploy TeamCity on admin node"
  hosts: admin
  become: false
  gather_facts: true

  vars:
    ci_domain: "debugmonkey.ru"
    ci_namespace: "ci"
    app_namespace: "web-app"
    deploy_sa: "ci-deployer"
    teamcity_tag: "2026.2"
    kubeconfig_path: "/home/ubuntu/.kube/config"
    ci_kubeconfig: "/home/ubuntu/ci-kubeconfig"
    registry_key_file: "{{ playbook_dir }}/../vault/ci-registry-key.json"
    registry_key_remote: "/home/ubuntu/ci-registry-key.json"
    ci_data_dir: "/home/ubuntu/teamcity"
    rendered_dir: "/home/ubuntu/rendered"

    # --- Terraform для инфраструктурного пайплайна (раздел 6 roadmap) ---
    # Бинарь ставится на ноду и монтируется в агент: запускать terraform
    # через docker run нельзя — агент видит рабочую директорию как
    # /opt/buildagent/work, а демон хоста как /home/ubuntu/teamcity/agent/work,
    # и путь из контейнера в -v не разрешится.
    terraform_version: "1.14.8"
    tf_sa_key_file: "{{ playbook_dir }}/../vault/diploma-sa-key.json"
    tf_sa_key_remote: "/home/ubuntu/tf-sa-key.json"
    s3_key_file: "{{ playbook_dir }}/../vault/s3_key"
    s3_key_remote: "/home/ubuntu/s3_key"
    # Публичный SSH-ключ нужен terraform в пайплайне: он подставляет его в
    # metadata машин (var.ssh_key). Секретом не является.
    ssh_pub_key_file: "{{ playbook_dir }}/../vault/id_ed25519.pub"
    ssh_pub_key_remote: "/home/ubuntu/id_ed25519.pub"
    tf_tfvars_remote: "/home/ubuntu/ci.tfvars"
    terraformrc_remote: "/home/ubuntu/terraformrc"
    # Идентификаторы каталога — не секреты; те же значения лежат в bootstrap/00-bootstrap.sh
    tf_org_id: "bpfuhii9ok1q5hhitspn"
    tf_cloud_id: "b1gguv60gg3mvfac0ql6"
    tf_folder_id: "b1g3ccq6pd5djimr73u2"
    tf_sa_id: "ajeci4s6cdan53143ob7"
    # Пересоздать контейнер агента. Нужно при изменении списка монтирований:
    # без этого плейбук увидит существующий контейнер и пропустит его.
    ci_recreate_agent: false
    # Адрес API-сервера берём по IP: имя k8s-master-01 резолвится только
    # на admin через /etc/hosts, а kubeconfig читается ещё и из контейнера агента.
    api_server: "https://{{ master_ip }}:6443"
    # Адрес самой admin-ноды — его получают Endpoints, через которые ingress
    # проксирует трафик на TeamCity, живущий вне кластера.
    admin_internal_ip: "{{ ansible_host }}"

  tasks:
    # ------------------------- Docker -------------------------
    - name: "32-1 Install Docker apt prerequisites"
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
      become: true

    - name: "32-2 Add Docker GPG key"
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc
      become: true

    - name: "32-3 Add Docker repository"
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present
        update_cache: true
      become: true

    - name: "32-4 Install Docker Engine"
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
        state: present
      become: true

    # ------------------------- Данные и ключ реестра -------------------------
    - name: "32-5 Require registry key file"
      ansible.builtin.assert:
        that: lookup('file', registry_key_file, errors='ignore') | length > 0
        quiet: true
        fail_msg: >-
          Не найден ключ реестра {{ registry_key_file }}. Создай его:
          yc iam key create --service-account-id <sa-id> --output vault/ci-registry-key.json

    - name: "32-6 Copy registry key to admin node"
      ansible.builtin.copy:
        content: "{{ lookup('file', registry_key_file) }}"
        dest: "{{ registry_key_remote }}"
        mode: "0600"
      no_log: true

    - name: "32-7 Create TeamCity data directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - "{{ ci_data_dir }}/server"
        - "{{ ci_data_dir }}/agent/conf"
        - "{{ ci_data_dir }}/agent/work"
      become: true

    # ------------------------- Terraform для инфра-пайплайна -------------------------
    - name: "32-7a Check installed terraform"
      ansible.builtin.command: terraform version
      register: tf_check
      changed_when: false
      failed_when: false

    - name: "32-7b Install terraform {{ terraform_version }}"
      when: tf_check.rc != 0 or terraform_version not in tf_check.stdout
      block:
        - name: "32-7b-1 Install unzip"
          ansible.builtin.apt:
            name: unzip
            state: present
            update_cache: true
          become: true

        # releases.hashicorp.com отдаёт 404 для российских адресов («Content not
        # available in your region»), поэтому качаем с зеркала Yandex Cloud.
        - name: "32-7b-2 Download terraform archive"
          ansible.builtin.get_url:
            url: >-
              https://hashicorp-releases.yandexcloud.net/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip
            dest: "/tmp/terraform-{{ terraform_version }}.zip"
            mode: "0644"

        - name: "32-7b-3 Unpack terraform"
          ansible.builtin.unarchive:
            src: "/tmp/terraform-{{ terraform_version }}.zip"
            dest: /usr/local/bin
            remote_src: true
            mode: "0755"
          become: true

        - name: "32-7b-4 Verify terraform"
          ansible.builtin.command: terraform version
          changed_when: false

    - name: "32-7c Require terraform service account key"
      ansible.builtin.assert:
        that: lookup('file', tf_sa_key_file, errors='ignore') | length > 0
        quiet: true
        fail_msg: >-
          Не найден ключ {{ tf_sa_key_file }}. Он создаётся bootstrap/00-bootstrap.sh.

    - name: "32-7d Require S3 static key"
      ansible.builtin.assert:
        that: lookup('file', s3_key_file, errors='ignore') | length > 0
        quiet: true
        fail_msg: "Не найден файл {{ s3_key_file }} со статическим ключом доступа к Object Storage."

    - name: "32-7e Copy terraform SA key to admin node"
      ansible.builtin.copy:
        content: "{{ lookup('file', tf_sa_key_file) }}"
        dest: "{{ tf_sa_key_remote }}"
        mode: "0600"
      no_log: true

    - name: "32-7f Copy S3 static key to admin node"
      ansible.builtin.copy:
        content: "{{ lookup('file', s3_key_file) }}"
        dest: "{{ s3_key_remote }}"
        mode: "0600"
      no_log: true

    # terraform читает этот файл при планировании (var.ssh_key), а в чекауте
    # сборки каталога vault/ нет.
    - name: "32-7f2 Copy SSH public key to admin node"
      ansible.builtin.copy:
        src: "{{ ssh_pub_key_file }}"
        dest: "{{ ssh_pub_key_remote }}"
        mode: "0644"

    # terraform.tfvars в git не попадает (см. .gitignore), поэтому для пайплайна
    # рендерится отдельный файл переменных. Путь к ключу — контейнерный.
    - name: "32-7g Render ci.tfvars for the terraform pipeline"
      ansible.builtin.copy:
        content: |
          organization_id = "{{ tf_org_id }}"
          cloud_id        = "{{ tf_cloud_id }}"
          folder_id       = "{{ tf_folder_id }}"
          sa_id           = "{{ tf_sa_id }}"
          sa_key_file     = "/keys/tf-sa-key.json"
          ssh_key         = "/keys/id_ed25519.pub"
        dest: "{{ tf_tfvars_remote }}"
        mode: "0644"

    # registry.terraform.io тоже отдаёт 404 для российских адресов, поэтому
    # terraform init ходит за провайдерами через зеркало Yandex Cloud.
    - name: "32-7h Render terraformrc with provider mirror"
      ansible.builtin.copy:
        content: |
          provider_installation {
            network_mirror {
              url     = "https://terraform-mirror.yandexcloud.net/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
        dest: "{{ terraformrc_remote }}"
        mode: "0644"

    # ------------------ Namespace приложения до ServiceAccount ------------------
    # SA создаётся внутри namespace, а полный манифест (Namespace, Role,
    # RoleBinding) применяет 33-app-prepare.yaml — в цепочке 90-install-k8s.yaml
    # он идёт позже. Поэтому namespace заводим здесь; повторный apply в 33
    # идемпотентен, а RoleBinding ссылается на SA, созданный ниже.
    - name: "32-7i Ensure app namespace exists"
      ansible.builtin.command: kubectl create namespace {{ app_namespace }}
      register: app_ns_create
      changed_when: "'created' in app_ns_create.stdout"
      failed_when: app_ns_create.rc != 0 and 'AlreadyExists' not in app_ns_create.stderr
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ------------------------- Kubeconfig для деплоя -------------------------
    - name: "32-8 Create deploy ServiceAccount"
      ansible.builtin.command: kubectl -n {{ app_namespace }} create serviceaccount {{ deploy_sa }}
      register: sa_create
      changed_when: "'created' in sa_create.stdout"
      failed_when: sa_create.rc != 0 and 'already exists' not in (sa_create.stderr | lower)
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # Долгоживущий токен: снаружи кластера иначе не аутентифицироваться.
    - name: "32-9 Create long-lived token for the deploy account"
      ansible.builtin.shell: |
        kubectl -n {{ app_namespace }} apply -f - <<'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: {{ deploy_sa }}-token
          annotations:
            kubernetes.io/service-account.name: {{ deploy_sa }}
        type: kubernetes.io/service-account-token
        EOF
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: "32-10 Wait for the token to be issued"
      ansible.builtin.shell: >-
        kubectl -n {{ app_namespace }} get secret {{ deploy_sa }}-token
        -o jsonpath='{.data.token}' | base64 -d
      register: sa_token
      until: sa_token.stdout | length > 20
      retries: 12
      delay: 5
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      no_log: true

    - name: "32-11 Read cluster CA"
      ansible.builtin.command: >-
        kubectl config view --raw --minify
        -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
      register: cluster_ca
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      no_log: true

    # У set-cluster нет флага --certificate-authority-data: CA передаётся файлом
    # с --embed-certs, иначе сертификат в kubeconfig не попадёт и kubectl уйдёт
    # на localhost:8080. Значение CA достаём из kubeconfig admin-ноды.
    - name: "32-12 Build kubeconfig for the pipeline"
      ansible.builtin.shell: |
        set -e
        K={{ ci_kubeconfig }}
        CA=/tmp/ci-ca.crt
        kubectl config view --raw --minify \
          -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
          --kubeconfig={{ kubeconfig_path }} | base64 -d > "$CA"
        rm -f "$K"
        kubectl config set-cluster k8s --server={{ api_server }} \
          --certificate-authority="$CA" --embed-certs=true --kubeconfig="$K"
        kubectl config set-credentials {{ deploy_sa }} --token='{{ sa_token.stdout }}' --kubeconfig="$K"
        kubectl config set-context ci --cluster=k8s --user={{ deploy_sa }} --kubeconfig="$K"
        kubectl config use-context ci --kubeconfig="$K"
        chmod 0600 "$K"
        rm -f "$CA"
      args:
        creates: "{{ ci_kubeconfig }}"
      no_log: true

    # ------------------------- Контейнеры TeamCity -------------------------
    - name: "32-13 Run TeamCity server"
      ansible.builtin.shell: |
        if docker ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx teamcity-server; then
          echo "exists"
        else
          docker run -d --name teamcity-server --restart always \
            -p 8111:8111 \
            -e TEAMCITY_SERVER_MEM_OPTS="-Xmx2048m" \
            -v {{ ci_data_dir }}/server:/data/teamcity_server/datadir \
            jetbrains/teamcity-server:{{ teamcity_tag }} >/dev/null && echo "created"
        fi
      register: tc_server
      changed_when: "'created' in tc_server.stdout"
      become: true

    # Агент собирает образы хостовым Docker: пробрасываем сокет и добавляем
    # группу сокета, чтобы пользователь агента имел к нему доступ.
    # kubectl монтируем с хоста — скачивать его в шаге сборки не нужно.
    # Путь к kubectl узнаём на месте: он ставится пакетом и лежит в /usr/bin,
    # а не в /usr/local/bin. Если смонтировать несуществующий путь, Docker создаст
    # на его месте каталог, и внутри контейнера kubectl окажется директорией.
    - name: "32-13a Find kubectl path"
      ansible.builtin.shell: command -v kubectl
      register: kubectl_bin
      changed_when: false
      failed_when: kubectl_bin.rc != 0

    - name: "32-13b Find terraform path"
      ansible.builtin.shell: command -v terraform
      register: terraform_bin
      changed_when: false
      failed_when: terraform_bin.rc != 0

    # Монтирования меняются редко, а контейнер создаётся только если его ещё нет.
    # Поэтому при изменении списка монтирований агента просим пересоздание:
    #   ansible-playbook -i inventory.ini 32-ci.yaml -e ci_recreate_agent=true
    - name: "32-13c Recreate the agent container when requested"
      ansible.builtin.command: docker rm -f teamcity-agent
      when: ci_recreate_agent | bool
      changed_when: true
      become: true

    - name: "32-14 Run TeamCity agent"
      ansible.builtin.shell: |
        if docker ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx teamcity-agent; then
          echo "exists"
        else
          docker run -d --name teamcity-agent --restart always \
            --add-host host.docker.internal:host-gateway \
            -e SERVER_URL=http://host.docker.internal:8111 \
            -e AGENT_NAME=k8s-agent-01 \
            -e TF_CLI_CONFIG_FILE=/keys/terraformrc \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add $(stat -c '%g' /var/run/docker.sock) \
            -v {{ registry_key_remote }}:/keys/key.json:ro \
            -v {{ ci_kubeconfig }}:/keys/kubeconfig:ro \
            -v {{ kubectl_bin.stdout }}:/usr/local/bin/kubectl:ro \
            -v {{ terraform_bin.stdout }}:/usr/local/bin/terraform:ro \
            -v {{ tf_sa_key_remote }}:/keys/tf-sa-key.json:ro \
            -v {{ s3_key_remote }}:/keys/s3_key:ro \
            -v {{ ssh_pub_key_remote }}:/keys/id_ed25519.pub:ro \
            -v {{ tf_tfvars_remote }}:/keys/ci.tfvars:ro \
            -v {{ terraformrc_remote }}:/keys/terraformrc:ro \
            -v {{ ci_data_dir }}/agent/conf:/data/teamcity_agent/conf \
            -v {{ ci_data_dir }}/agent/work:/opt/buildagent/work \
            jetbrains/teamcity-agent:{{ teamcity_tag }} >/dev/null && echo "created"
        fi
      register: tc_agent
      changed_when: "'created' in tc_agent.stdout"
      become: true

    # ------------------------- Публикация UI в кластере -------------------------
    - name: "32-15 Create namespace for CI objects"
      ansible.builtin.command: kubectl create namespace {{ ci_namespace }}
      register: ns_create
      changed_when: "'created' in ns_create.stdout"
      failed_when: ns_create.rc != 0 and 'AlreadyExists' not in ns_create.stderr
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # Старые объекты CI из кластера больше не нужны: сервер и агент теперь на VM.
    - name: "32-16 Remove in-cluster TeamCity workloads"
      ansible.builtin.command: >-
        kubectl -n {{ ci_namespace }} delete deployment teamcity-server teamcity-agent
        serviceaccount teamcity-agent --ignore-not-found=true
      register: ci_cleanup
      changed_when: "'deleted' in ci_cleanup.stdout"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: "32-17 Create directory for rendered manifests"
      ansible.builtin.file:
        path: "{{ rendered_dir }}"
        state: directory
        mode: "0755"

    - name: "32-18 Render external service manifests"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/ci/ci-external.yaml.j2"
        dest: "{{ rendered_dir }}/ci-external.yaml"
        mode: "0644"

    - name: "32-19 Apply external service manifests"
      ansible.builtin.command: kubectl apply -f {{ rendered_dir }}/ci-external.yaml
      register: ci_external
      changed_when: "'created' in ci_external.stdout or 'configured' in ci_external.stdout"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: "32-20 Wait for TeamCity server to answer"
      ansible.builtin.uri:
        url: "http://localhost:8111/healthCheck/healthy"
        status_code: 200
      register: tc_health
      until: tc_health.status == 200
      retries: 30
      delay: 10
      changed_when: false

  post_tasks:
    - name: Display URL and next steps
      ansible.builtin.debug:
        msg:
          - "TeamCity: http://ci.{{ ci_domain }}/"
          - "Контейнеры: teamcity-server и teamcity-agent на admin-ноде"
          - "Конфигурация сборок в базе сервера: создаётся скриптом ci/teamcity-setup.sh"
          - "Terraform для инфра-пайплайна: {{ terraform_version }}, смонтирован в агент"
