---
# Плейбук присоединения дополнительных master-нод (control-plane) к кластеру
- name: "[22] Join master node to the Kubernetes cluster"
  hosts: masters
  become: true
  gather_facts: true

  vars:
    cri_socket: "unix:///var/run/containerd/containerd.sock"

  pre_tasks:
    # Первый мастер уже инициализирован kubeadm init, ему присоединяться не нужно
    # ansible.builtin.meta: end_host - завершает выполнение текущего сценария дя хоста
    - name: Skip control-plane join for the primary master
      meta: end_host
      when: inventory_hostname == master_name

    # Проверяем локально: kubelet.conf появляется только после успешного join,
    # поэтому обращаться к API-серверу здесь не нужно
    - name: Check if node already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Skip already joined master
      meta: end_host
      when: kubelet_conf.stat.exists

  tasks:
    # certificate-key живет ~2 часа, поэтому генерируется заново при каждом запуске
    - name: Generate control-plane certificate key
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: upload_certs
      changed_when: false
      delegate_to: "{{ master_name }}"
      run_once: true

    - name: Create join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false
      delegate_to: "{{ master_name }}"
      run_once: true

    - name: Parse join parameters
      ansible.builtin.set_fact:
        certificate_key: "{{ upload_certs.stdout_lines | last }}"
        kubeadm_join_api_server: "{{ join_command_raw.stdout | regex_search('kubeadm join (\\S+):6443', '\\1') | first }}"
        kubeadm_join_token: "{{ join_command_raw.stdout | regex_search('--token (\\S+)', '\\1') | first }}"
        kubeadm_join_ca_hash: "{{ join_command_raw.stdout | regex_search('--discovery-token-ca-cert-hash sha256:(\\S+)', '\\1') | first }}"

    - name: Verify join parameters
      ansible.builtin.assert:
        that:
          - certificate_key is defined and certificate_key != ''
          - kubeadm_join_token is defined and kubeadm_join_token != ''
          - kubeadm_join_ca_hash is defined and kubeadm_join_ca_hash != ''

    - name: Join master node to the cluster
      ansible.builtin.command: >
        kubeadm join {{ kubeadm_join_api_server }}:6443
        --token {{ kubeadm_join_token }}
        --discovery-token-ca-cert-hash sha256:{{ kubeadm_join_ca_hash }}
        --control-plane
        --certificate-key {{ certificate_key }}
        --cri-socket {{ cri_socket }}

  post_tasks:
    - name: Show join status
      ansible.builtin.debug:
        msg: "✅ Master node {{ inventory_hostname }} joined the cluster!"

