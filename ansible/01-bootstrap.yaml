---
- name: "[01] Bootstrap Kubernetes nodes"
  hosts: masters:workers:admin
  become: true
  gather_facts: false

  tasks:
    - name: Wait for apt to be free
      ansible.builtin.include_tasks: tasks/wait-for-apt.yml

    - name: Install Python dependency without Ansible Python
      ansible.builtin.raw: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update && apt-get install -y python3

- name: "[01] Bootstrap Kubernetes nodes with facts"
  hosts: masters:workers:admin
  become: true
  gather_facts: true

  tasks:
    # Автообновления на узле Kubernetes опасны: могут перезапустить containerd
    # или kubelet под работающим кластером.
    - name: Disable periodic APT upgrades
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Ensure Python dependency is present
      ansible.builtin.apt:
        name:
          - python3
        state: present