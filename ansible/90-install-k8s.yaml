---
# Головной playbook для установки Kubernetes кластера и аддонов.
# Блоки нумерации:
#   0x - подготовка инфраструктуры и узлов, кластера ещё нет
#   1x - подготовка узлов Kubernetes
#   2x - сборка кластера
#   3x - дополнения в уже собранном кластере
# Номер файла совпадает с шагом выполнения.
#
# Порядок выполнения:
# 1.  01-bootstrap.yaml - установка Python на узлы
# 2.  03-admin-prepare.yaml - apt-репозиторий Kubernetes и kubectl на admin
# 3.  10-k8s-common.yaml - подготовка узлов и установка Kubernetes
# 4.  11-master.yaml - настройка master-нод
# 5.  20-kubeadm-init.yaml - инициализация кластера на master
# 6.  21-kubeadm-join.yaml - присоединение workers к кластеру
# 7.  22-kubeadm-join-master.yaml - присоединение дополнительных master
# 8.  23-admin-kube-config.yaml - kubeconfig и проверка доступа с admin
# 9.  24-flannel.yaml - CNI и ожидание готовности узлов
# 10. 30-monitoring.yaml - стек мониторинга (kube-prometheus-stack)
# 11. 31-ingress.yaml - ingress-контроллер и публикация Grafana на 80 порту
# 12. 32-ci.yaml - TeamCity: сервер, агент сборки и веб-интерфейс на 80 порту
# 13. 33-app-prepare.yaml - namespace приложения и права пайплайна на деплой

- name: "01 Bootstrap Kubernetes nodes"
  import_playbook: 01-bootstrap.yaml

- name: "03 Prepare admin node"
  import_playbook: 03-admin-prepare.yaml

- name: "10 Prepare Kubernetes nodes"
  import_playbook: 10-k8s-common.yaml

- name: "11 Configure Kubernetes master nodes"
  import_playbook: 11-master.yaml

- name: "20 Initialize Kubernetes cluster"
  import_playbook: 20-kubeadm-init.yaml

- name: "21 Join worker nodes to cluster"
  import_playbook: 21-kubeadm-join.yaml

- name: "22 Join additional master nodes"
  import_playbook: 22-kubeadm-join-master.yaml

- name: "23 Install kubeconfig on admin"
  import_playbook: 23-admin-kube-config.yaml

- name: "24 Deploy CNI and wait for cluster"
  import_playbook: 24-flannel.yaml

- name: "30 Deploy monitoring stack"
  import_playbook: 30-monitoring.yaml

- name: "31 Deploy ingress controller"
  import_playbook: 31-ingress.yaml

- name: "32 Deploy TeamCity"
  import_playbook: 32-ci.yaml

- name: "33 Prepare app namespace"
  import_playbook: 33-app-prepare.yaml
