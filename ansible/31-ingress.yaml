---
# Ingress-контроллер и публикация Grafana на 80 порту.
# Блок 3x: дополнения в уже собранном кластере, ставится после 30-monitoring.yaml.
#
# Как трафик попадает в кластер:
#   клиент -> статический адрес NAT-ноды :80 -> DNAT -> NodePort воркера :30080
#          -> kube-proxy -> под ingress-nginx -> Service Grafana
#
# Все ноды кластера в приватных подсетях, публичный адрес есть только у NAT-ноды,
# поэтому вход снаружи делается пробросом порта на ней. Обратный трафик работает
# за счёт правила MASQUERADE из 02-nat-gateway.yaml: пакет уходит к воркеру через
# тот же интерфейс, и источник подменяется на адрес NAT-ноды.
#
# Имена сервисов собираются из домена ci_domain (group_vars/all.yml). В его зоне
# заведена wildcard-запись *.debugmonkey.ru, которая указывает на статический адрес
# NAT-ноды (создаётся Terraform: ресурс yandex_vpc_address в tf/41-static-ip.tf,
# адрес смотри в `terraform output nat-public-ip`). Поэтому адрес ссылок не зависит
# от пересборки кластера — в отличие от динамического IP, который выдаётся заново.
#
# Домен можно переопределить при запуске: -e ci_domain=example.com

- name: "[31] Deploy ingress controller"
  hosts: admin
  become: false
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    ingress_nginx_version: "4.15.1"
    ingress_namespace: ingress-nginx
    # NodePort'ы фиксируем, чтобы DNAT на NAT-ноде знал точный порт.
    ingress_http_nodeport: 30080
    ingress_https_nodeport: 30443
    # Значения чарта держим отдельным словарём: так Ansible отдаёт их
    # в модуль как структуру, а не как строку.
    ingress_values:
      controller:
        replicaCount: 1
        service:
          type: NodePort
          nodePorts:
            http: "{{ ingress_http_nodeport }}"
            https: "{{ ingress_https_nodeport }}"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

  tasks:
    - name: "31-1 Set ingress host"
      ansible.builtin.set_fact:
        ingress_host: "grafana.{{ ci_domain }}"

    - name: "31-2 Add ingress-nginx chart repository"
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    # Тип сервиса NodePort: облачного балансировщика в кластере нет,
    # LoadBalancer остался бы в статусе Pending.
    - name: "31-3 Install ingress-nginx {{ ingress_nginx_version }}"
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        chart_version: "{{ ingress_nginx_version }}"
        release_namespace: "{{ ingress_namespace }}"
        create_namespace: true
        values: "{{ ingress_values }}"
        wait: true
        wait_timeout: 10m

    - name: "31-4 Create directory for rendered manifests"
      ansible.builtin.file:
        path: "{{ rendered_dir }}"
        state: directory
        mode: "0755"

    - name: "31-5 Render Grafana ingress"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/ingress/grafana-ingress.yaml.j2"
        dest: "{{ rendered_dir }}/grafana-ingress.yaml"
        mode: "0644"

    - name: "31-6 Apply Grafana ingress"
      ansible.builtin.command: kubectl apply -f {{ rendered_dir }}/grafana-ingress.yaml
      register: ingress_apply
      changed_when: "'created' in ingress_apply.stdout or 'configured' in ingress_apply.stdout"

    - name: "31-7 Collect ingress state"
      ansible.builtin.command: kubectl get ingress -A
      register: ingress_state
      changed_when: false

    - name: Display ingresses
      ansible.builtin.debug:
        msg: "{{ ingress_state.stdout_lines | default([]) }}"

- name: "[31] Publish ingress through NAT node"
  hosts: nat_gateway
  become: true
  gather_facts: false

  vars:
    ingress_http_nodeport: 30080
    # NodePort открыт на всех нодах, поэтому заворачиваем на первого воркера.
    dnat_target_ip: "{{ hostvars[groups['workers'][0]]['ansible_host'] }}"
    # Внутренний адрес самой NAT-ноды. Совпадение по нему обязательно:
    # без него правило перехватывает весь исходящий HTTP кластера — пакеты
    # к внешним сайтам приходят на eth0 с портом 80 и уезжают в ingress,
    # который отвечает 404. Именно так ломался apt внутри сборки образа.
    nat_internal_ip: "{{ hostvars[groups['nat_gateway'][0]]['ansible_host'] }}"

  tasks:
    # Снимаем правила DNAT прошлых прогонов, не глядя на адрес назначения.
    # Так надо потому, что после пересборки кластера внутренние адреса worker'ов
    # меняются: правило указывает на машину, которой больше нет, а iptables
    # берёт первое совпадение — то есть оставленное старое правило перед новым
    # означает мёртвый вход. Именно это случилось на прогоне с нуля: кластер
    # здоров, а снаружи не отвечает ничего.
    #
    # Удаляем по номеру правила, а не по спецификации: `-D` требует точного
    # совпадения канонизированного правила, и попытка удалить «правило с любым
    # адресом» не находит ничего (проверено — остались дубликаты). Номера
    # берём с конца, чтобы удаление не сдвигало следующие.
    - name: "31-8 Check current DNAT rules for port 80"
      ansible.builtin.shell: |
        iptables -t nat -S PREROUTING | grep -- '--dport 80 -j DNAT' || true
      register: dnat_current
      changed_when: false

    - name: "31-8a Find the default interface"
      ansible.builtin.command: ip route show default
      register: nat_default_route
      changed_when: false

    - name: "31-8b Drop stale DNAT rules"
      ansible.builtin.shell: |
        before=$(iptables -t nat -S PREROUTING | grep -c -- '--dport 80 -j DNAT' || true)
        for n in $(iptables -t nat -L PREROUTING --line-numbers -n \
                   | awk '/DNAT/ && /dpt:80/ {print $1}' | sort -rn); do
          iptables -t nat -D PREROUTING "$n"
        done
        echo "dropped=$before"
      register: dnat_dropped
      changed_when: "'dropped=0' not in dnat_dropped.stdout"
      when: >-
        dnat_current.stdout_lines | length != 1
        or ('--to-destination ' ~ dnat_target_ip ~ ':' ~ ingress_http_nodeport)
           not in dnat_current.stdout

    # Модуль сам проверяет, есть ли правило, поэтому повторный прогон
    # ничего не меняет: раньше задача с raw сообщала об изменении всегда.
    - name: "31-8c Add DNAT rule for port 80"
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        in_interface: "{{ nat_default_route.stdout_lines[0].split()[4] }}"
        destination: "{{ nat_internal_ip }}"
        protocol: tcp
        destination_port: "80"
        jump: DNAT
        to_destination: "{{ dnat_target_ip }}:{{ ingress_http_nodeport }}"
      register: dnat_rule

    # netfilter-persistent сохраняет правила на диск, чтобы они пережили
    # перезагрузку ноды.
    - name: "31-8d Save iptables rules"
      ansible.builtin.command: netfilter-persistent save
      when: dnat_rule.changed or (dnat_dropped.changed | default(false))
      changed_when: false

- name: "[31] Show access URL"
  hosts: admin
  become: false
  gather_facts: false

  tasks:
    - name: Display access URL
      ansible.builtin.debug:
        msg:
          - "Grafana: http://{{ ingress_host }}/"
          - "Логин: admin, пароль лежит в vault/grafana_admin_password"
          - "Проверка: curl -I http://{{ ingress_host }}/login"
