---
# Общая подготовка Kubernetes-нод
- name: "[10] Prepare Kubernetes nodes"
  hosts: masters:workers
  become: true
  gather_facts: true

  vars:
    kubernetes_version: "1.35"

  tasks:
    - name: 10-1 Ensure control-plane endpoint in hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ master_ip }} {{ master_name }}"
        regexp: ' {{ master_name }}$'
        state: present
      # when: inventory_hostname != master_name

    - name: Wait for apt to be free
      ansible.builtin.include_tasks: tasks/wait-for-apt.yml

    - name: 10-2 Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: 10-3 Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - unattended-upgrades
          - software-properties-common
        state: present

    - name: 10-4 Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: 10-5 Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '.*swap.*'
        state: absent
        backup: true

    - name: 10-6 Load kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: 10-6a Persist kernel modules across reboot
      ansible.builtin.copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'

    - name: 10-7 Configure sysctl parameters for Kubernetes
      ansible.builtin.copy:
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'

    - name: 10-8 Apply sysctl parameters
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: 10-9 Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 10-10 Download Kubernetes GPG key over IPv4
      ansible.builtin.shell:
        cmd: >-
          curl -4 -fsSL
          https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key |
          gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: 10-11 Add Kubernetes repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
        state: present
        update_cache: true

    - name: 10-12 Refresh facts after repository setup
      ansible.builtin.setup:

    - name: 10-13 Download Docker GPG key over IPv4
      ansible.builtin.shell:
        cmd: >-
          curl -4 -fsSL https://download.docker.com/linux/ubuntu/gpg |
          gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
        creates: /etc/apt/keyrings/docker.gpg

    - name: 10-14  Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: false

    - name: 10-15 Update apt cache after repository setup
      ansible.builtin.apt:
        update_cache: true

    - name: 10-16 Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present

    - name: 10-17 Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: 10-18 Generate containerd default configuration
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml
        creates: /etc/containerd/config.toml

    - name: 10-19 Configure containerd to use systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: 10-20 Ensure containerd is running
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    - name: 10-21 Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name:
          - kubelet={{ kubernetes_version }}.*
          - kubeadm={{ kubernetes_version }}.*
          - kubectl={{ kubernetes_version }}.*
        state: present
        force: true

    - name: 10-22 Hold Kubernetes packages at current version
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: fixed

    - name: 10-23 Enable containerd service
      ansible.builtin.service:
        name: containerd
        enabled: true

    - name: 10-24 Enable kubelet service
      ansible.builtin.service:
        name: kubelet
        enabled: true

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted

  post_tasks:
    - name: Verify containerd is running
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_status
      changed_when: false
      failed_when: false

    - name: Show containerd status
      ansible.builtin.debug:
        msg: "containerd status: {{ containerd_status.stdout }}"
