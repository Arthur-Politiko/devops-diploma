---
# Применение CNI и ожидание готовности узлов.
# Выполняется последним, когда все ноды уже в кластере
- name: "[24] Deploy CNI and wait for cluster"
  hosts: admin
  become: false
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    # Применение CNI-плагина (Flannel)
    - name: 24-1 Apply Flannel CNI plugin
      ansible.builtin.command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    # Узел в статусе NotReady тоже содержит подстроку Ready,
    - name: 24-2 Wait for all nodes to be ready
      ansible.builtin.command: kubectl get nodes -o wide
      register: kubectl_get_nodes
      changed_when: false
      until: "'NotReady' not in kubectl_get_nodes.stdout"
      retries: 60
      delay: 10

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ kubectl_get_nodes.stdout_lines | default(['Waiting for nodes...']) }}"
