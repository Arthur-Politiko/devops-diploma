---
# Плейбук инициализации Kubernetes кластера на мастер-ноде
- name: "[20] Initialize Kubernetes cluster on master node"
  hosts: masters
  become: true
  gather_facts: true

  vars:
    kubernetes_version: "1.35.0"
    pod_network_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"
    api_server_advertise_address: "{{ ansible_default_ipv4.address }}"
    cri_socket: "unix:///var/run/containerd/containerd.sock"
    admin_kubeconfig_path: "/etc/kubernetes/admin.conf"

  tasks:
    # admin.conf существует = кластер уже инициализирован.
    - name: 20-1 Check if cluster is already initialized
      ansible.builtin.stat:
        path: "{{ admin_kubeconfig_path }}"
      register: admin_conf_stat
      when: inventory_hostname == master_name

    - name: 20-2 Set cluster_initialized fact
      ansible.builtin.set_fact:
        cluster_initialized: "{{ admin_conf_stat.stat.exists | default(false) }}"

    # Инициализация кластера Kubernetes только на одном мастере.
    # admin.conf остаётся только здесь: это рабочий конфиг самого kubeadm.
    # Копий в ~/.kube на мастере нет — все обращения к кластеру идут
    # с admin-ноды 
    - name: 20-3 Initialize Kubernetes cluster
      ansible.builtin.command: >
        kubeadm init
        --control-plane-endpoint {{ master_name }}:6443
        --kubernetes-version={{ kubernetes_version }}
        --pod-network-cidr={{ pod_network_cidr }}
        --service-cidr={{ service_cidr }}
        --apiserver-advertise-address={{ api_server_advertise_address }}
        --cri-socket={{ cri_socket }}

      register: kubeadm_init
      changed_when: true
      when: not cluster_initialized and inventory_hostname == master_name

    - name: Display cluster info
      ansible.builtin.debug:
        msg: |
          {% if kubeadm_init is defined and kubeadm_init.changed %}
          Kubernetes cluster initialized successfully!
          {% else %}
          Cluster already initialized, nothing to do.
          {% endif %}

          Master node IP: {{ api_server_advertise_address }}
          Pod CIDR: {{ pod_network_cidr }}
          Service CIDR: {{ service_cidr }}
