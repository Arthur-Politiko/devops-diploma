# Тестовое приложение: nginx со статической страницей.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: web-app
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      # Секрет с ключом сервисного аккаунта: кластер тянет образ из cr.yandex.
      # Создаётся в шаге деплоя из того же ключа, что смонтирован в агент.
      imagePullSecrets:
        - name: registry-key
      containers:
        - name: web-app
          # Реестр и версию задаёт окружение, а не манифест: реестр создаётся
          # terraform, и Ansible выставляет образ сразу после применения
          # (плейбук 33-app-prepare.yaml), а версию на каждом релизе — пайплайн
          # через kubectl set image. Литерал здесь означал бы, что смена реестра
          # требует правки этого файла: эта грабля уже срабатывала, когда
          # прежний реестр перестал существовать.
          image: IMAGE_SET_BY_ANSIBLE_OR_CI
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
